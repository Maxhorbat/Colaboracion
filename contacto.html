<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>God of War - Contacto</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <nav class="barra-navegacion">
        <div class="logo-omega">Ω</div>
        <ul class="enlaces-nav">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="videojuegos.html">Videojuegos</a></li>
            <li><a href="herreria.html">Herrería</a></li>
            <li><a href="contacto.html" class="activo">Contacto</a></li>
            <li><a href="compras.html">Compras</a></li>
        </ul>
        <a href="login.html" class="btn-inicio-sesion">Iniciar Sesión</a>
    </nav>

    <header>
        <h1>⚔️ Formulario de Consultas y Quejas ⚔️</h1>
    </header>

    <main>
        <form class="form-contacto" action="#" method="POST">
            <div class="grupo-form">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Ej: Kratos de Esparta">
            </div>

            <div class="grupo-form">
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" name="correo" required placeholder="ejemplo@correo.com">
            </div>

            <div class="grupo-form">
                <label for="tipo">Tipo de Mensaje:</label>
                <select id="tipo" name="tipo">
                    <option value="duda">Duda o Consulta</option>
                    <option value="queja">Queja / Reclamo</option>
                    <option value="pedido">Estado de Pedido</option>
                </select>
            </div>

            <div class="grupo-form">
                <label for="mensaje">Detalle su mensaje:</label>
                <textarea id="mensaje" name="mensaje" required placeholder="Escriba aquí sus dudas o reclamos..."></textarea>
            </div>

            <button type="submit" class="btn-inicio-sesion" style="width: 100%;">Enviar Mensaje</button>
        </form>
    </main>

    <footer>
        <p>⚔️ Diseño y Programación Web — Estilo God of War — Neyen Aharon Lovon Puma ⚔️</p>
    </footer>

</body>
</html>
