<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>God of War - Iniciar Sesión</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <nav class="barra-navegacion">
        <div class="logo-omega">Ω</div>
        <ul class="enlaces-nav">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="videojuegos.html">Videojuegos</a></li>
            <li><a href="herreria.html">Herrería</a></li>
            <li><a href="contacto.html">Contacto</a></li>
            <li><a href="compras.html">Compras</a></li>
        </ul>
        <a href="login.html" class="btn-inicio-sesion">Iniciar Sesión</a>
    </nav>

    <header>
        <h1>⚔️ Acceso al Portal Espartano ⚔️</h1>
    </header>

    <main>
        <section class="contenedor-login">
            <h2 style="color: var(--oro-brillante); text-align: center; margin-bottom: 20px; font-family: var(--fuente-titulo);">Iniciar Sesión</h2>
            <form action="index.html" method="GET">
                <div class="grupo-form">
                    <label for="usuario">Usuario o Correo:</label>
                    <input type="text" id="usuario" name="usuario" required placeholder="Ej: KratosSpartan">
                </div>

                <div class="grupo-form">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn-inicio-sesion" style="width: 100%; margin-top: 10px;">Ingresar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>⚔️ Diseño y Programación Web — Estilo God of War — Neyen Aharon Lovon Puma ⚔️</p>
    </footer>

</body>
</html>
